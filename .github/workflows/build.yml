name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8' 
          channel: 'stable'
          cache: true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install & Build (Single Session)
        run: |
          # 1. Set Flet's Flutter path
          export FLET_FLUTTER_DIR=$(dirname $(which flutter))
          
          # 2. Install dependencies
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # 3. Verify flet is installed
          python -c "import flet; print('Flet version:', flet.__version__)"
          
          # 4. Build APK using python -m to avoid PATH issues
          python -m flet build apk --module-name app

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/apk/**/*.apk
          retention-days: 7
