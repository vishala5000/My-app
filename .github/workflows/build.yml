name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 1. Pre-install the EXACT Flutter version Flet 0.86.5 requires
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8' 
          channel: 'stable'
          cache: true

      # 2. Set the environment variable so Flet finds it immediately
      - name: Set Flet Flutter Path
        run: |
          echo "FLET_FLUTTER_DIR=$(dirname $(which flutter))" >> $GITHUB_ENV

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          # Add Python bin to PATH to ensure 'flet' command is found
          export PATH="$PATH:$(python -m site --user-base)/bin:$(dirname $(which python))/../bin"
          
          # Use 'python -m flet' as a fallback if 'flet' command fails
          if ! command -v flet &> /dev/null; then
            echo "flet command not found, using python -m flet"
            python -m flet build apk --module-name app
          else
            flet build apk --module-name app
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/apk/**/*.apk
          retention-days: 7
