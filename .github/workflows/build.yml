name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          pip install -r requirements.txt

      # 1. Install Flutter manually so Flet doesn't have to ask
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Use a stable version compatible with Flet 0.86
          channel: 'stable'

      # 2. Tell Flet where Flutter is installed
      - name: Set Flutter Path
        run: |
          echo "FLET_FLUTTER_DIR=$(which flutter | sed 's|bin/flutter||')" >> $GITHUB_ENV

      # 3. Accept Android Licenses (Required for building APK)
      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      # 4. Build the APK
      - name: Build APK
        run: |
          flet build apk

      # 5. Upload the result
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-flet-app
          path: build/apk/**/*.apk
          retention-days: 5
